<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Human Body Explorer · Body Atlas</title>
<style>
:root{
  --bg:#EDF4F1; --panel:#FFFFFF; --ink:#14213D; --muted:#55657A; --line:#D3E2DE;
  --teal:#0F766E; --gold:#E9A800; --soft:#F4F9F7; --red:#C42B3A; --blue:#2E6BD6;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(1100px 700px at 25% -10%,#FFFFFF 0%,var(--bg) 60%);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;line-height:1.55;min-height:100vh}
h1,h2,h3{font-family:Palatino,"Palatino Linotype","Book Antiqua",Georgia,serif;margin:0;line-height:1.15}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

header{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between;padding:20px 28px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.7)}
.title h1{font-size:1.9rem;color:var(--ink)}
.title p{margin:2px 0 0;color:var(--muted);font-size:.95rem}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.seg button{background:transparent;border:0;padding:9px 14px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--teal);color:#fff;font-weight:700}
.search{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 14px;color:var(--ink);width:240px}
.walk{background:var(--gold);color:#1A1A1A;border:0;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer}

.layout{display:grid;grid-template-columns:minmax(300px,380px) 1fr 330px;gap:20px;padding:20px 28px 40px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 1px 0 rgba(20,33,61,.04),0 12px 30px -18px rgba(20,33,61,.25)}

/* FIGURE */
.stage{position:sticky;top:16px;background:radial-gradient(420px 360px at 50% 40%,#FFFFFF 0%,#F3F8F6 70%);}
svg#fig{width:100%;height:auto;display:block}
#fig .skin{transition:opacity .6s}
#fig.skel-on .skin{opacity:.55}
#fig.organ-on .skin{opacity:.22}
#fig:not(.skin-on) .skin{opacity:0}
#fig:not(.skel-on) .skel{display:none}
#fig:not(.organ-on) .organs,#fig:not(.organ-on) .flow{display:none}
.hit{fill:transparent;stroke:transparent;cursor:pointer}
.hit:hover{fill:rgba(233,168,0,.13);stroke:rgba(233,168,0,.45)}
.skel [data-id],.organs [data-id]{cursor:pointer;transition:filter .2s}
.skel [data-id]:hover,.organs [data-id]:hover,.sel{filter:drop-shadow(0 0 4px rgba(233,168,0,.95)) drop-shadow(0 0 1px #B07D00)}
.organs [data-id]:hover{filter:brightness(1.12) drop-shadow(0 0 3px rgba(233,168,0,.9))}
@keyframes draw{from{stroke-dasharray:1;stroke-dashoffset:1}to{stroke-dasharray:1;stroke-dashoffset:0}}
.skel-draw path,.skel-draw line{pathLength:1;animation:draw 1.4s ease both}
.skel-draw path:nth-child(4n){animation-delay:.25s}
.skel-draw path:nth-child(4n+1){animation-delay:.1s}
.skel-draw path:nth-child(4n+2){animation-delay:.45s}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.12)}28%{transform:scale(1)}42%{transform:scale(1.07)}58%{transform:scale(1)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.035,1.05)}}
.beat{transform-box:fill-box;transform-origin:center;animation:beat 1.1s ease-in-out infinite}
.breath{transform-box:fill-box;transform-origin:50% 0;animation:breathe 4.6s ease-in-out infinite}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:.84rem;color:var(--muted);margin-top:12px;justify-content:center}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.cap{font-size:.86rem;color:var(--muted);text-align:center;margin:8px 0 0}

/* CARD */
.card{min-height:640px;display:flex;flex-direction:column}
.kicker{font-size:.9rem;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kicker .sw{width:12px;height:12px;border-radius:50%;display:inline-block}
.card h2{font-size:2.6rem;margin-top:8px;color:var(--ink)}
.pron{font-style:italic;color:var(--teal);font-size:1.05rem;margin:4px 0 14px}
.sec{margin-top:16px}
.sec h3{font-size:.98rem;color:var(--muted);font-family:"Trebuchet MS",system-ui,sans-serif;font-weight:700;margin-bottom:4px}
.sec p{margin:0;font-size:1.06rem;max-width:62ch}
.sec ol{margin:4px 0 0 20px;padding:0;font-size:1.03rem}
.sec ol li{margin:5px 0}
.fact{border-left:4px solid var(--gold);background:#FFF7DD;padding:12px 16px;border-radius:0 12px 12px 0}
.memo{border-left:4px solid var(--blue);background:#E8F1FD;padding:12px 16px;border-radius:0 12px 12px 0}
.welcome p{font-size:1.1rem;color:var(--muted);max-width:50ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:.95rem}
.chip:hover{border-color:var(--teal)}
.nav-row{margin-top:auto;padding-top:24px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.nav-row button{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;max-width:45%}
.nav-row button:disabled{opacity:.4;cursor:default}
.nav-row .count{color:var(--muted);font-size:.92rem}

/* LIST */
.list-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.list-head span{color:var(--muted);font-size:.9rem}
.list{max-height:calc(100vh - 150px);overflow:auto;padding-right:6px}
.grp{font-size:.82rem;color:var(--teal);margin:14px 0 4px;font-weight:700}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;border:0;border-radius:10px;padding:7px 10px;cursor:pointer}
.item:hover{background:var(--soft)}
.item[aria-current="true"]{background:#E4F2EF;box-shadow:inset 3px 0 0 var(--teal)}
.item small{color:#8798AB;font-size:.78rem}
.empty{color:var(--muted);font-size:.95rem}

@media (max-width:1180px){
  .layout{grid-template-columns:minmax(260px,340px) 1fr}
  .list-panel{grid-column:1 / -1}
  .list{max-height:none}
}
@media (max-width:760px){
  .layout{grid-template-columns:1fr;padding:14px}
  .stage{position:static}
  .card{min-height:0}
  header{padding:16px}
  .search{width:100%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

    document.querySelectorAll(`#fig [data-region="${regionKey}"]`).forEach(e=>e.classList.add("sel"));
  } else if(id){
    document.querySelectorAll(`#fig [data-id="${id}"]`).forEach(e=>e.classList.add("sel"));
  }
}

function selectPart(id){
  const p = BY[id]; if(!p) return;
  current = {type:"part", id};
  walkIdx = PARTS.indexOf(p);
  highlight(id);
  renderCard();
  renderList();
  $("#card").scrollIntoView({block:"nearest",behavior:"smooth"});
}

function selectRegion(key){
  current = {type:"region", key};
  walkIdx = -1;
  highlight(null, key);
  renderCard();
  renderList();
}

function renderCard(){
  const box = $("#card");
  if(!current){
    box.innerHTML = `
      <div class="welcome">
        <p class="kicker">Start here</p>
        <h2>Explore ${PARTS.length} parts of your body</h2>
        <p>Tap a region of the figure, a bone, or an organ. Use the buttons above to show the skeleton and organs, or take a guided walk from the head to the toes.</p>
        <div class="chips">
          <button class="chip" data-start="hair">Start at the hair</button>
          <button class="chip" data-start="skull">See the skull</button>
          <button class="chip" data-start="heart">Meet the heart</button>
        </div>
      </div>`;
    box.querySelectorAll("[data-start]").forEach(b=>b.addEventListener("click",()=>selectPart(b.dataset.start)));
    return;
  }

  if(current.type==="region"){
    const parts = PARTS.filter(p=>p.region===current.key);
    box.innerHTML = `
      <div class="kicker">Body region</div>
      <h2>${esc(REGION_NAMES[current.key]||current.key)}</h2>
      <p class="pron">${parts.length} parts in this region. Choose one to learn about it.</p>
      <div class="chips">${parts.map(p=>`<button class="chip" data-id="${p.id}">${esc(p.name)}</button>`).join("")}</div>`;
    box.querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>selectPart(b.dataset.id)));
    return;
  }

  const p = BY[current.id];
  const idx = walkIdx;
  const prev = idx>0 ? PARTS[idx-1] : null;
  const next = idx<PARTS.length-1 ? PARTS[idx+1] : null;
  const swatch = p.color || "#B9AE94";
  const steps = p.steps ? `<div class="sec"><h3>How it works</h3><ol>${p.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol></div>` : "";
  box.innerHTML = `
    <div class="kicker"><span class="sw" style="background:${swatch}"></span>${esc(p.kind)} · ${esc(p.group)}${p.sys?` · ${esc(p.sys)}`:""}</div>
    <h2>${esc(p.name)}</h2>
    ${p.pron?`<p class="pron">Say it: ${esc(p.pron)}</p>`:`<div style="height:12px"></div>`}
    ${p.where?`<div class="sec"><h3>Where it is</h3><p>${esc(p.where)}</p></div>`:""}
    <div class="sec"><h3>What it does</h3><p>${esc(p.what)}</p></div>
    ${steps}
    ${p.fact?`<div class="sec"><div class="fact"><b>Fun fact:</b> ${esc(p.fact)}</div></div>`:""}
    ${p.mem?`<div class="sec"><div class="memo"><b>Memory trick:</b> ${esc(p.mem)}</div></div>`:""}
    ${p.note?`<div class="sec"><p>${esc(p.note)}</p></div>`:""}
    <div class="nav-row">
      <button id="prevBtn" ${prev?"":"disabled"}>${prev?"← "+esc(prev.name):"Start"}</button>
      <span class="count">${idx+1} of ${PARTS.length}</span>
      <button id="nextBtn" ${next?"":"disabled"}>${next?esc(next.name)+" →":"End of tour"}</button>
    </div>`;
  if(prev) $("#prevBtn").addEventListener("click",()=>selectPart(prev.id));
  if(next) $("#nextBtn").addEventListener("click",()=>selectPart(next.id));
}

function renderList(){
  const q = $("#q").value.trim().toLowerCase();
  const groups = ["Head","Upper body","Arms and hands","Lower body","Skeleton","Inside the body","Extras"];
  let html = "";
  for(const g of groups){
    const items = PARTS.filter(p=>p.group===g && (!q || p.name.toLowerCase().includes(q) || (p.what||"").toLowerCase().includes(q)));
    if(!items.length) continue;
    html += `<div class="grp">${g} (${items.length})</div>`;
    html += items.map(p=>{
      const sel = current && current.type==="part" && current.id===p.id;
      return `<button class="item" data-id="${p.id}" aria-current="${sel}"><span>${esc(p.name)}</span><small>${p.cat==="organ"?esc(p.sys.split(" ")[0]):""}</small></button>`;
    }).join("");
  }
  $("#list").innerHTML = html || `<p class="empty">No part matches "${esc(q)}". Try a different word.</p>`;
  $("#list").querySelectorAll(".item").forEach(b=>b.addEventListener("click",()=>selectPart(b.dataset.id)));
  $("#total").textContent = PARTS.length+" parts";
}

/* events */
document.querySelectorAll("#hitG [data-region]").forEach(e=>{
  e.addEventListener("click",()=>selectRegion(e.dataset.region));
  e.setAttribute("tabindex","0"); e.setAttribute("role","button");
  e.addEventListener("keydown",ev=>{ if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();selectRegion(e.dataset.region);} });
});
document.querySelectorAll("#skelG [data-id], #orgG [data-id]").forEach(e=>{
  e.addEventListener("click",ev=>{ ev.stopPropagation(); selectPart(e.dataset.id); });
});
function toggle(btnId, cls){
  const b = $(btnId);
  b.addEventListener("click",()=>{
    const on = b.getAttribute("aria-pressed")!=="true";
    b.setAttribute("aria-pressed",on);
    $("#fig").classList.toggle(cls,on);
  });
}
toggle("#t-skin","skin-on");
toggle("#t-skel","skel-on");
toggle("#t-organ","organ-on");
$("#q").addEventListener("input",renderList);
$("#walkBtn").addEventListener("click",()=>selectPart(PARTS[0].id));

/* init */
$("#fig").classList.add("skin-on","skel-on");
renderCard();
renderList();
</script>
</body>
</html>
